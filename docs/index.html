<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>M3K Préstamos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="M3K Préstamos">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  html, body { margin:0; height:100%; background:#0B0B0C; color:#F4F4F2; font-family:system-ui, sans-serif; overflow:hidden; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:#0B0B0C; padding-top:env(safe-area-inset-top); box-sizing:border-box; }
  #carga { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:#0B0B0C; transition:opacity .4s; }
  #carga img { width:96px; height:96px; border-radius:22px; animation:resp 1.6s ease-in-out infinite; }
  #carga a { color:#9A9AA0; font-size:13px; }
  @keyframes resp { 0%,100% { transform:scale(1); opacity:.85 } 50% { transform:scale(1.06); opacity:1 } }
</style>
</head>
<body>
<div id="carga"><img src="icon-192.png" alt="M3K"><span>Abriendo M3K Préstamos…</span>
  <a href="https://m3k-prestamos.streamlit.app/" target="_top">¿Tarda mucho? Abrir directamente</a></div>
<iframe id="app" title="M3K Préstamos" src="https://m3k-prestamos.streamlit.app/?embed=true" allow="clipboard-write; web-share; camera"></iframe>
<script>
  document.getElementById("app").addEventListener("load", function () {
    setTimeout(function () { var c = document.getElementById("carga"); c.style.opacity = 0; setTimeout(function () { c.style.display = "none"; }, 450); }, 1200);
  });
  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
</script>
</body>
</html>
