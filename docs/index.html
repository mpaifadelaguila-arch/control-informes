<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>M3K Préstamos</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="M3K Préstamos">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
  html, body { margin:0; height:100%; background:#0B0B0C; color:#F4F4F2; font-family:system-ui, sans-serif; overflow:hidden; }
  /* el modo embed añade una barra inferior y un marco claro: el iframe se estira unos píxeles y el sobrante queda fuera de pantalla */
  iframe { position:fixed; top:-3px; left:-3px; width:calc(100% + 6px); height:calc(100% + 3px + 56px); border:0; background:#0B0B0C; }
  #carga { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:#0B0B0C; transition:opacity .4s; }
  #carga img { width:96px; height:96px; border-radius:22px; animation:resp 1.6s ease-in-out infinite; }
  #carga a { color:#9A9AA0; font-size:13px; }
  iframe { position:fixed; top:-3px; left:-3px; width:calc(100% + 6px); height:calc(100% + 3px + 56px); border:0; background:#0B0B0C; }
  @keyframes resp { 0%,100% { transform:scale(1); opacity:.85 } 50% { transform:scale(1.06); opacity:1 } }
</style>
</head>
<body>
<div id="carga"><img src="icon-192.png" alt="M3K"><span id="msg">Abriendo M3K Préstamos…</span>
  <a id="abrir" href="https://m3k-prestamos.streamlit.app/" style="display:none;background:#B8F53A;color:#0A1A05;padding:12px 22px;border-radius:12px;font-weight:600;font-size:15px;text-decoration:none">Abrir la app</a></div>
<script>
  /* Instalada (icono): abre la app directo. En el navegador se queda para poder instalarla. */
  var instalada = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  if (instalada) {
    /* modo app: la app se muestra a pantalla completa dentro de la página (sin barra del navegador) */
    var f = document.createElement("iframe");
    f.title = "M3K Préstamos"; f.allow = "clipboard-write; web-share; camera";
    f.src = "https://m3k-prestamos.streamlit.app/?embed=true&embed_options=dark_theme";
    f.addEventListener("load", function () { setTimeout(function () { var c = document.getElementById("carga"); c.style.opacity = 0; setTimeout(function () { c.style.display = "none"; }, 450); }, 1200); });
    document.body.appendChild(f);
    document.getElementById("abrir").style.display = "inline-block";
    document.getElementById("msg").textContent = "Abriendo M3K Préstamos…";
  }
  else {
    document.getElementById("msg").textContent = "Para instalar: menú ⋮ de Chrome → Instalar app";
    document.getElementById("abrir").style.display = "inline-block";
  }
  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
</script>
</body>
</html>
