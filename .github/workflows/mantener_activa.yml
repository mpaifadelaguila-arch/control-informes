name: Mantener la app activa

# Streamlit Community Cloud duerme la app tras unas horas sin visitas.
# Esta tarea visita cada app cada 6 horas para que no entre en reposo.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  visitar:
    # Las direcciones se guardan en variables de repositorio (Settings > Secrets and variables > Actions > Variables):
    # APP_URL (app de informes) y APP_URL_PRESTAMOS (app de préstamos). Si APP_URL_PRESTAMOS no existe se usa la dirección de M3K Préstamos.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python .github/scripts/mantener_activa.py
        env:
          APP_URL: ${{ vars.APP_URL }}
          APP_URL_PRESTAMOS: ${{ vars.APP_URL_PRESTAMOS || 'https://m3k-prestamos.streamlit.app' }}
